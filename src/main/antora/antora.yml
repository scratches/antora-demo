name: spring-demo
title: Spring Demo
version: ~
display-version: x.x.y
nav:
- modules/ROOT/nav.adoc
ext:
  collector:
    - run: 
        command: mvnw process-classes
        local: true
      scan:
        - dir: target/classes/static
          into: modules/ROOT/assets/attachments
        - dir: target/reports/apidocs
          into: modules/ROOT/assets/attachments/apidocs